name: eval-gate

on:
  push:
  pull_request:

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Offline tests
        run: >-
          python -m unittest
          tests.test_eval_runner
          tests.test_grading
          tests.test_review_schedule
          tests.test_mistake_store
          tests.test_code_sandbox
          tests.test_chat_store
          tests.test_code_attempt_store
          tests.test_vision
          -v
      - name: Tool-selection dry run
        run: python -m backend.platform.eval_runner --dry-run
